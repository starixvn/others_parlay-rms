<ng-template #colgroup>
  <colgroup>
      <col style="width: 140px" />
      <col style="width: 140px" />
      <col style="width: 90px" />
      <col style="width: 130px" />
      <col style="width: 130px" />
      <col style="width: 130px" />
      <col style="width: 130px" />
      <col style="width: 130px" />
      <col style="width: 130px" />
      <col style="width: 130px" />
  </colgroup>
</ng-template>
<ng-template #thead>
  <thead class="sort">
      <tr>
          <th scope="col">Member</th>
          <th scope="col">Customer Class</th>
          <th scope="col" [appSort]="[winLoss.rows]" data-order="desc" data-prop="betCount">
            Bet Count
            <span><em class="fa fa-sort-up"></em><em class="fa fa-sort-down"></em></span>
          </th>
          <th scope="col" [appSort]="[winLoss.rows]" data-order="desc" data-prop="memberWinLoss">
            Member Win Loss
            <span><em class="fa fa-sort-up"></em><em class="fa fa-sort-down"></em></span>
          </th>
          <th scope="col" [appSort]="[winLoss.rows]" data-order="desc" data-prop="smaWinLoss">
            SMA Win Loss
            <span><em class="fa fa-sort-up"></em><em class="fa fa-sort-down"></em></span>
          </th>
          <th scope="col">Extra PT</th>
          <th scope="col">Commission</th>
          <th scope="col" [appSort]="[winLoss.rows]" data-order="desc" data-prop="realIncome">
            Real Income
            <span><em class="fa fa-sort-up"></em><em class="fa fa-sort-down"></em></span>
          </th>
          <th scope="col" [appSort]="[winLoss.rows]" data-order="desc" data-prop="realTurnover">
            Real Turnover
            <span><em class="fa fa-sort-up"></em><em class="fa fa-sort-down"></em></span>
          </th>
          <th scope="col" [appSort]="[winLoss.rows]" data-order="desc" data-prop="margin">
            Margin
            <span><em class="fa fa-sort-up"></em><em class="fa fa-sort-down"></em></span>
          </th>
      </tr>
  </thead>
</ng-template>
<ng-template #rowItem let-item="item">
  <td>{{ item.username }}</td>
  <td class="text-right">{{item.customerClass}}</td>
  <td class="text-right">{{item.betCount}}</td>
  <td [ngClass]="{'red': item.memberWinLoss > 0, 'text-right' : 1}" [napDecimalFormat]="item.memberWinLoss"></td>
  <td [ngClass]="{'red': item.smaWinLoss > 0, 'text-right' : 1}" [napDecimalFormat]="item.smaWinLoss"></td>
  <td class="text-right" [napDecimalFormat]="item.extraPT"></td>
  <td class="text-right" [napDecimalFormat]="item.commission"></td>
  <td [ngClass]="{'red': item.realIncome <= 0 , 'text-right' : 1}" [napDecimalFormat]="item.realIncome"></td>
  <td class="text-right" [napDecimalFormat]="item.realTurnover"></td>
   <td [ngClass]="{'red': item.margin <= 0, 'text-right' : 1}">
     <span [napDecimalFormat]="item.margin"></span>%
   </td>
</ng-template>
<div *ngIf="winLoss" [ngSwitch]="winLoss.rows.length > 0">
  <div class="nap-grid">
      <div style="width: 1300px;">
          <div class="header">
              <table>
                  <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                  <ng-template [ngTemplateOutlet]="thead"></ng-template>
              </table>
          </div>
          <div *ngSwitchCase="true" class="body overflow-hidden-x">
            <table class="table-striped">
              <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
              <tbody>
                <tr *ngFor="let item of winLoss.rows">
                  <ng-template [ngTemplateOutlet]="rowItem" [ngTemplateOutletContext]="{ item: item }">
                  </ng-template>
                </tr>
              </tbody>
            </table>
          </div>
          <div *ngSwitchCase="false" class="body stretch">
              <table>
                  <tbody>
                      <tr>
                          <th class="no-data" colspan="10">
                              There is no data
                          </th>
                      </tr>
                  </tbody>
              </table>
          </div>
          <div *ngSwitchCase="true" class="footer">
              <table>
                  <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                  <tfoot>
                      <tr class="font-weight-bold">
                          <td class="text-right" colspan="2">{{winLoss.username}}</td>
                          <td class="text-right">{{winLoss.betCount}}</td>
                          <td [ngClass]="{'red': winLoss.memberWinLoss > 0, 'text-right' : 1}" [napDecimalFormat]="winLoss.memberWinLoss"></td>
                          <td [ngClass]="{'red': winLoss.smaWinLoss > 0, 'text-right' : 1}" [napDecimalFormat]="winLoss.smaWinLoss"></td>
                          <td class="text-right" [napDecimalFormat]="winLoss.extraPT"></td>
                          <td class="text-right" [napDecimalFormat]="winLoss.commission"></td>
                          <td [ngClass]="{'red': winLoss.realIncome <= 0 , 'text-right' : 1}" [napDecimalFormat]="winLoss.realIncome"></td>
                          <td class="text-right" [napDecimalFormat]="winLoss.realTurnover"></td>
                          <td [ngClass]="{'red': winLoss.margin <= 0, 'text-right' : 1}">
                            <span [napDecimalFormat]="winLoss.margin"></span>%
                          </td>
                      </tr>
                      <tr>
                        <td class="paging" colspan="10">
                          <nap-pagination [config]="paginationInstance" (pageChange)="onPageChange()"></nap-pagination>
                        </td>
                      </tr>
                  </tfoot>
              </table>
          </div>
      </div>
  </div>
</div>
