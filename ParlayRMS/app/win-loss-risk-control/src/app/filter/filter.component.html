<div class="nap-filter">
  <div class="row">
    <div class="nap-col">
      <div class="nap-group">
        <label class="width-50">Company</label>
        <div class="nap-control">
          <ngx-dropdown-treeview [items]="company|companyTreeview"
            [config]="companyConfig" (selectedChange)="selectedCompany = $event">
          </ngx-dropdown-treeview>
        </div>
      </div>
    </div>

    <div class="nap-col">
      <div class="nap-group">
        <button class="btn btn-favorite" (click)="addFavorite()">
          <i class="fa fa-heart text-danger"></i> Add to favorites
        </button>
      </div>
    </div>

    <div class="nap-col">
      <div class="nap-group">
        <label class="col-form-label">From</label>
        <div class="nap-control width-100">
          <nap-date-picker [(date)]="fromDate" [minDate]="minStartDate" [maxDate]="maxEndDate" (dateChange)="onFromDateChange()"></nap-date-picker>
        </div>
      </div>
    </div>

    <div class="nap-col">
      <div class="nap-group">
        <label class="col-form-label">To</label>
        <div class="nap-control width-100">
          <nap-date-picker [(date)]="toDate" [minDate]="fromDate" [maxDate]="maxEndDate" (dateChange)="onToDateChange()"></nap-date-picker>
        </div>
      </div>
    </div>

    <div class="nap-col">
      <div class="nap-group">
        <label class="width-50">Selection</label>
        <div class="nap-control">
          <select class="nap-textbox" [(ngModel)]="selectedLiveType">
            <option *ngFor="let liveType of liveTypeItems" [value]="liveType.id">
                 {{liveType.name}}
             </option>
          </select>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="nap-col">
      <div class="nap-group">
        <label class="width-50">Parlay type</label>
        <div class="nap-control">
          <ngx-dropdown-treeview [items]="parlayType | parlayTreeview"
          [config]="parlayTypeConfig" (selectedChange)="selectedParlayType = $event">
        </ngx-dropdown-treeview>
        </div>
      </div>
    </div>

    <div class="nap-col width-134">
      <div class="nap-group">
      </div>
    </div>

    <div class="nap-col">
      <div class="nap-group">
        <label class="width-50">Sports type</label>
        <div class="nap-control">
          <ngx-dropdown-treeview [items]="sportsType | sportTreeview"
          [config]="sportsTypeConfig" (selectedChange)="selectedSportsType = $event">
        </ngx-dropdown-treeview>
        </div>
      </div>
    </div>

    <div class="nap-col">
      <div class="nap-group">
        <label class="width-50">Combo</label>
        <div class="nap-control">
          <ngx-dropdown-treeview [items]="comboType | comboTreeview"
          [config]="comboTypeConfig" (selectedChange)="selectedcomboType = $event">
        </ngx-dropdown-treeview>
        </div>
      </div>
    </div>

    <div class="nap-col col-buttons">
      <button class="btn btn-primary" (click)="onSubmit()">Submit</button>
    </div>
  </div>
</div>
