<ng-template #contentRef>
  <app-league #league [hidden]="!(filterModel && isShowLeague)" [data]="this.leagueData"
    (clickedOnLeague)="showEvent($event)">
  </app-league>
  <app-event *ngIf="filterModel && !isShowLeague && !isShowDetail" [data]="this.eventData"
    (showBackLeague)="showBackLeague()" (clickedOnEvent)="showEventDetail($event)"
    (clickedExportExcel)="exportExcel($event)" [isClickedOnleague]="isClickedOnleague">
  </app-event>
  <app-event-detail *ngIf="filterModel && !isShowLeague && isShowDetail"
    [isClickedOnEvent]="isClickedOnEvent" [data]="this.eventDetailData"
    (clickedExportExcel)="exportExcel($event)" (showBackEvent)="showBackEvent()">
  </app-event-detail>
</ng-template>
<div>
  <div class="nap-header">
    <div class="title">
      League & Event Monitor
    </div>
  </div>
  <app-filter #filterComponent (generated)="generate($event)" [netcoreApiUrl]="netcoreApiUrl"></app-filter>
  <nap-toast></nap-toast>
  <ng-container #containerRef>  
  </ng-container>
</div>
<nap-spinner></nap-spinner>
